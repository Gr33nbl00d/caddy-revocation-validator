
name: Build

on: [push]

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Do not cancel other matrix jobs if one fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.0']

        include:
          # Minimum Go patch version
          - go: '1.26.0'
            GO_SEMVER: '1.26.0'

          # OS-specific variables
          # CADDY_BIN_PATH: path to compiled Caddy binary
          # SUCCESS: expected shell exit status
          - os: ubuntu-latest
            CADDY_BIN_PATH: ./cmd/caddy/caddy
            SUCCESS: 0

          - os: macos-latest
            CADDY_BIN_PATH: ./cmd/caddy/caddy
            SUCCESS: 0

          - os: windows-latest
            CADDY_BIN_PATH: ./cmd/caddy/caddy.exe
            SUCCESS: 'True'

    runs-on: ${{ matrix.os }}

    env:
      # Prevent automatic downloads of other Go toolchains
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.GO_SEMVER }}

      - name: Verify Go
        run: |
          go version
          go env GOTOOLCHAIN

      - name: Clean stale caches
        run: go clean -cache -testcache

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Test Report
        run: go test -v ./... -json > testReport.json

      - name: Test Coverage
        run: go test -v ./... -covermode=atomic -coverprofile=coverage.out
